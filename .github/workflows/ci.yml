name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kindergarten
          POSTGRES_USER: kg_app
          POSTGRES_PASSWORD: kg_app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kg_app -d kindergarten"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kg_app:kg_app_test_password@localhost:5432/kindergarten
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      APP_URL: http://localhost:3010
      PORT: 3010
      API_PREFIX: /api/v1
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./data/files
      SEED_OWNER_EMAIL: owner@demo.local
      SEED_OWNER_PASSWORD: ChangeMe12345!

    steps:
      - uses: actions/checkout@v4

      # pg-boss requires >=22.12.0 — same version the production
      # Dockerfile uses, so CI catches anything Node-version-sensitive
      # before a real deploy would.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm test

      - name: Seed (owner user + permission catalog + templates)
        run: npm run seed

      - name: E2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Docker image build
        run: docker build -t kindergarten-api:ci .

  # Builds the real production image and pushes it to GHCR. Only runs for
  # pushes to main (not PRs — no reason to publish an image for every PR
  # branch) and only once `test` has passed.
  docker-publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        run: |
          repo_lc=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha_short=$(git rev-parse --short HEAD)
          echo "repo_lc=$repo_lc" >> "$GITHUB_OUTPUT"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo_lc:sha-$sha_short" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lc }}:latest
            ${{ steps.vars.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # SSH-deploys the image docker-publish just pushed onto the production
  # VPS. Deliberately does not hard-fail when DEPLOY_* secrets aren't
  # configured yet (see DEPLOYMENT.md) — it warns and skips, so this
  # workflow stays green before a server exists to deploy to.
  deploy:
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] || \
             [ -z "${{ secrets.DEPLOY_SSH_USER }}" ] || [ -z "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "::warning::DEPLOY_HOST / DEPLOY_SSH_USER / DEPLOY_SSH_KEY / DEPLOY_PATH not all set — skipping deploy. See DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and restart on the server
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export API_IMAGE="${{ needs.docker-publish.outputs.image }}"
            docker compose -f docker-compose.prod.yml --env-file .env.production pull api
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker image prune -f

      - name: Smoke test
        if: steps.check.outputs.ready == 'true'
        run: |
          sleep 10
          curl -fsS "https://${{ vars.DOMAIN }}${{ vars.API_PREFIX || '/api/v1' }}/health"
